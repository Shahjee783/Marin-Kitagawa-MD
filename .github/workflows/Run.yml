name: Marin free Deploy 

on:
  push:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm' # Speeds up builds by caching dependencies

      - name: Install FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          # Automatically downloads the latest stable FFmpeg release
          ffmpeg-version: release

      - name: Install Dependencies
        run: npm install

      - name: Run Bot
        run: npm start
        
